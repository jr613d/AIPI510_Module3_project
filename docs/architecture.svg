<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Churn predictor architecture</title>
  <desc id="desc">Users use a Streamlit app that posts to a Cloud Run API whose Docker image already contains the model. Separately, data flows from Hugging Face through ingest.py to a Cloud Storage bucket; training downloads it, verifies it, and logs to Weights and Biases; docker build and push send the image to Artifact Registry, from which Cloud Run deploys.</desc>
  <style>
    svg { --bg: #ffffff; --panel: #ffffff; --fg: #1b2129; --muted: #5c6673; --line: #c9ced6;
          --accent: #0f62fe; --accent-soft: #e5edff; --boundary: #8a94a3; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --panel: #161b22; --fg: #e6edf3; --muted: #9aa4b2; --line: #30363d;
            --accent: #78a9ff; --accent-soft: #172440; --boundary: #6e7681; }
    }
    .bg { fill: var(--bg); }
    .box { fill: var(--panel); stroke: var(--fg); stroke-width: 1.4; }
    .box.live { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
    .inner { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .zone { fill: none; stroke: var(--boundary); stroke-width: 1.2; stroke-dasharray: 6 5; }
    .zone-label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--boundary); letter-spacing: .04em; }
    .t { font: 600 14px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .s { font: 400 12px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .m { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .edge { fill: none; stroke: var(--fg); stroke-width: 1.4; }
    .edge.live { stroke: var(--accent); stroke-width: 2; }
    .lbl { font: 500 11.5px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--muted); }
    .lbl.live { fill: var(--accent); }
    .lbl, .zone-label { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .head { fill: var(--fg); }
    .head.live { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="arw-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head live"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="650" rx="10"/>

  <!-- Zones -->
  <rect class="zone" x="580" y="20" width="500" height="520" rx="8"/>
  <text class="zone-label" x="596" y="40">GOOGLE CLOUD · us-east1</text>
  <rect class="zone" x="200" y="225" width="340" height="330" rx="8"/>
  <text class="zone-label" x="216" y="245">YOUR COMPUTER · local or Docker</text>

  <!-- Outside services -->
  <rect class="box live" x="20" y="60" width="160" height="70" rx="6"/>
  <text class="t" x="100" y="90" text-anchor="middle">Users</text>
  <text class="s" x="100" y="110" text-anchor="middle">web browser</text>

  <rect class="box" x="20" y="170" width="160" height="60" rx="6"/>
  <text class="t" x="100" y="196" text-anchor="middle">GitHub repo</text>
  <text class="s" x="100" y="214" text-anchor="middle">code + config</text>

  <rect class="box" x="20" y="340" width="160" height="70" rx="6"/>
  <text class="t" x="100" y="368" text-anchor="middle">Weights &amp; Biases</text>
  <text class="m" x="100" y="388" text-anchor="middle">aipi510-churn</text>
  <text class="s" x="100" y="402" text-anchor="middle">public, view-only</text>

  <rect class="box" x="20" y="460" width="160" height="70" rx="6"/>
  <text class="t" x="100" y="488" text-anchor="middle">Hugging Face</text>
  <text class="s" x="100" y="508" text-anchor="middle">IBM Telco CSV (pinned)</text>

  <!-- Front end -->
  <rect class="box live" x="250" y="50" width="240" height="90" rx="6"/>
  <text class="t" x="370" y="78" text-anchor="middle">Streamlit Community Cloud</text>
  <text class="m" x="370" y="98" text-anchor="middle">frontend/app.py</text>
  <text class="s" x="370" y="118" text-anchor="middle">API address in a secret</text>

  <!-- Cloud Run -->
  <rect class="box live" x="610" y="50" width="440" height="140" rx="6"/>
  <text class="t" x="630" y="76">Cloud Run · churn-api</text>
  <text class="s" x="630" y="95">public HTTPS · max 1 instance · scales to zero</text>
  <rect class="inner" x="630" y="108" width="400" height="66" rx="4"/>
  <text class="m" x="646" y="130">Docker image</text>
  <text class="s" x="646" y="149">FastAPI  /predict  /health  /docs</text>
  <text class="s" x="646" y="165">model file built in · threshold 0.35 from config.yaml</text>

  <!-- Artifact Registry -->
  <rect class="box" x="610" y="265" width="440" height="66" rx="6"/>
  <text class="t" x="630" y="292">Artifact Registry</text>
  <text class="m" x="630" y="314">churn/churn-api (x86 image, tagged by commit)</text>

  <!-- Cloud Storage -->
  <rect class="box" x="610" y="420" width="440" height="84" rx="6"/>
  <text class="t" x="630" y="447">Cloud Storage · kangaroo_baseball_field</text>
  <text class="m" x="630" y="468">telco_churn.csv · public read</text>
  <text class="s" x="630" y="488">SHA-256 pinned in config.yaml</text>

  <!-- Local -->
  <rect class="box" x="225" y="262" width="290" height="56" rx="6"/>
  <text class="t" x="370" y="285" text-anchor="middle">docker build (x86)</text>
  <text class="s" x="370" y="304" text-anchor="middle">copies model in, checks it, records SHA</text>

  <rect class="box" x="225" y="350" width="290" height="70" rx="6"/>
  <text class="t" x="370" y="374" text-anchor="middle">Training · src/train.py</text>
  <text class="s" x="370" y="393" text-anchor="middle">split 70/15/15 · fit 8-input logistic</text>
  <text class="s" x="370" y="409" text-anchor="middle">regression · validate</text>

  <rect class="box" x="225" y="462" width="290" height="62" rx="6"/>
  <text class="t" x="370" y="487" text-anchor="middle">src/ingest.py</text>
  <text class="s" x="370" y="506" text-anchor="middle">download, verify checksum, clean</text>

  <!-- Every prediction -->
  <line class="edge live" x1="180" y1="84" x2="248" y2="84" marker-end="url(#arw-live)"/>
  <text class="lbl live" x="214" y="76" text-anchor="middle">fills form</text>
  <line class="edge live" x1="250" y1="112" x2="182" y2="112" marker-end="url(#arw-live)"/>
  <text class="lbl live" x="214" y="128" text-anchor="middle">result</text>

  <line class="edge live" x1="490" y1="80" x2="608" y2="80" marker-end="url(#arw-live)"/>
  <text class="lbl live" x="549" y="72" text-anchor="middle">POST /predict</text>
  <line class="edge live" x1="610" y1="116" x2="492" y2="116" marker-end="url(#arw-live)"/>
  <text class="lbl live" x="549" y="132" text-anchor="middle">probability, Yes/No</text>

  <!-- Retraining and redeploying -->
  <polyline class="edge" points="180,200 370,200 370,142" marker-end="url(#arw)"/>
  <text class="lbl" x="276" y="192" text-anchor="middle">deploys app</text>

  <line class="edge" x1="180" y1="495" x2="223" y2="495" marker-end="url(#arw)"/>
  <text class="lbl" x="202" y="487" text-anchor="middle">CSV</text>

  <line class="edge" x1="515" y1="486" x2="608" y2="486" marker-end="url(#arw)"/>
  <text class="lbl" x="562" y="502" text-anchor="middle">upload once</text>

  <polyline class="edge" points="610,440 560,440 560,385 517,385" marker-end="url(#arw)"/>
  <text class="lbl" x="566" y="414">download,</text>
  <text class="lbl" x="566" y="428">verify</text>

  <line class="edge" x1="225" y1="375" x2="182" y2="375" marker-end="url(#arw)"/>
  <text class="lbl" x="202" y="367" text-anchor="middle">logs</text>

  <line class="edge" x1="370" y1="350" x2="370" y2="320" marker-end="url(#arw)"/>
  <text class="lbl" x="378" y="339">model file</text>

  <line class="edge" x1="515" y1="292" x2="608" y2="292" marker-end="url(#arw)"/>
  <text class="lbl" x="562" y="284" text-anchor="middle">docker push</text>

  <line class="edge" x1="830" y1="265" x2="830" y2="192" marker-end="url(#arw)"/>
  <text class="lbl" x="840" y="232">gcloud run deploy</text>
  <text class="lbl" x="840" y="246">pulls the image</text>

  <text class="s" x="610" y="570">At prediction time the API contacts nothing else: no bucket, no W&amp;B, no logins.</text>
  <text class="s" x="610" y="588">Everything it needs is inside the image.</text>

  <!-- Legend -->
  <line class="edge live" x1="20" y1="612" x2="56" y2="612"/>
  <text class="s" x="64" y="616">every prediction</text>
  <line class="edge" x1="190" y1="612" x2="226" y2="612"/>
  <text class="s" x="234" y="616">retraining and redeploying</text>
</svg>
